apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apiserver
  namespace: default
spec:
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
  endpoints:
    - port: https
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
      relabelings:
        - targetLabel: job
          replacement: apiserver
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: up|apiserver_request_total|apiserver_request_terminations_total|apiserver_client_certificate_expiration_seconds_.+|aggregator_unavailable_apiservice.*|apiserver_storage_objects|apiserver_storage_size_bytes|etcd_db_total_size_in_bytes
          action: keep

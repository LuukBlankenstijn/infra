apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./flux/30_openbao
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system

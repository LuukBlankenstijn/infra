apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: services
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./flux/50_apps
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system

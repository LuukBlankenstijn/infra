apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  releaseName: flux-operator
  interval: 1h
  chart:
    spec:
      chart: flux-operator
      version: "0.62.0"
      sourceRef:
        kind: HelmRepository
        name: controlplaneio-fluxcd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    web:
      networkPolicy:
        create: false

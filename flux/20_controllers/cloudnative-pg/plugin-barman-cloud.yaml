apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg
spec:
  releaseName: plugin-barman-cloud
  interval: 1h
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.9.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  releaseName: external-secrets
  interval: 1h
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
  chart:
    spec:
      chart: external-secrets
      version: "2.13.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    installCRDs: true
    serviceMonitor:
      enabled: true

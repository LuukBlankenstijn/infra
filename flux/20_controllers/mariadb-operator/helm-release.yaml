apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: mariadb-operator
spec:
  releaseName: mariadb-operator-crds
  interval: 1h
  chart:
    spec:
      chart: mariadb-operator-crds
      version: "26.10.1"
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: mariadb-operator
spec:
  releaseName: mariadb-operator
  interval: 1h
  dependsOn:
    - name: mariadb-operator-crds
  chart:
    spec:
      chart: mariadb-operator
      version: "26.10.1"
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-key
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: netbird-mgmt-api-key
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: netbird/operator
        property: api_key

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upstreams
  namespace: agents
spec:
  podSelector:
    matchLabels:
      agents.luukblankenstijn.nl/role: upstream
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 9090

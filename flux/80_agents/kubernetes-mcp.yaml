apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agents-kubernetes-mcp
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats", "nodes/log"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agents-kubernetes-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agents-kubernetes-mcp
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: agents
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp
  namespace: agents
data:
  config.toml: |
    port = "8080"
    metrics_port = "9090"
    stateless = true
    cluster_provider_strategy = "in-cluster"
    toolsets = ["core"]
    enabled_tools = ["pods_exec", "pods_top", "nodes_top", "nodes_stats_summary", "nodes_log"]

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: kubernetes-mcp }
  template:
    metadata:
      labels: { app: kubernetes-mcp, agents.luukblankenstijn.nl/role: upstream }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: kubernetes-mcp
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubernetes-mcp-server
          image: quay.io/containers/kubernetes_mcp_server:v0.1.3
          args: ["--config", "/etc/kubernetes-mcp-server/config.toml"]
          ports:
            - name: mcp
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /healthz, port: mcp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp
  namespace: agents
spec:
  selector: { app: kubernetes-mcp }
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp

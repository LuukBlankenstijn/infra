apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: controlplaneio-fluxcd
  namespace: agents
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-mcp
  namespace: agents
spec:
  releaseName: flux-operator-mcp
  interval: 1h
  chart:
    spec:
      chart: flux-operator-mcp
      version: "0.62.1"
      sourceRef:
        kind: HelmRepository
        name: controlplaneio-fluxcd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    readonly: false
    commonLabels:
      agents.luukblankenstijn.nl/role: upstream

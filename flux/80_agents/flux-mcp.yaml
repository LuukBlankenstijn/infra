apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: controlplaneio-fluxcd
  namespace: agents
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-mcp
  namespace: agents
spec:
  releaseName: flux-operator-mcp
  interval: 1h
  chart:
    spec:
      chart: flux-operator-mcp
      version: "0.62.1"
      sourceRef:
        kind: HelmRepository
        name: controlplaneio-fluxcd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    readonly: false
    rbac:
      create: false
    commonLabels:
      agents.luukblankenstijn.nl/role: upstream
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agents-flux-operator-mcp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: flux-operator-mcp
    namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agents-operator
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/eviction
      - pods/log
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups:
      - apps
      - autoscaling
      - batch
      - discovery.k8s.io
      - networking.k8s.io
      - policy
      - snapshot.storage.k8s.io
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - fluxcd.controlplane.io
      - postgresql.cnpg.io
      - barmancloud.cnpg.io
      - k8s.mariadb.com
      - longhorn.io
      - cert-manager.io
      - acme.cert-manager.io
      - external-secrets.io
      - generators.external-secrets.io
      - traefik.io
      - monitoring.coreos.com
      - netbird.io
      - bitnami.com
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apiextensions.k8s.io", "storage.k8s.io", "metrics.k8s.io", "admissionregistration.k8s.io", "rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agents-flux-operator-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agents-operator
subjects:
  - kind: ServiceAccount
    name: flux-operator-mcp
    namespace: agents

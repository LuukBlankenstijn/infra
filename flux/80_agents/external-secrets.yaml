apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: gateway
  dataFrom:
    - extract:
        key: agents/gateway
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-mcp
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: home-assistant-mcp
  dataFrom:
    - extract:
        key: agents/home-assistant
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: grafana-mcp
  data:
    - secretKey: grafana_token
      remoteRef:
        key: agents/grafana
        property: token
      sourceRef:
        storeRef:
          name: grafana
          kind: SecretStore
    - secretKey: server_token
      remoteRef:
        key: agents/gateway
        property: grafana_mcp_token

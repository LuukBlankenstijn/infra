apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ntfy
  namespace: ntfy
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ntfy.luukblankenstijn.nl`)
      kind: Rule
      services:
        - name: ntfy
          port: 80
  tls:
    options:
      name: device-mtls
      namespace: traefik

apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: ntfy
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secret
  namespace: ntfy
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: secret-ntfy
          serviceAccountRef:
            name: openbao

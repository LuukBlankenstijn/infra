apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: ntfy }
  template:
    metadata:
      labels: { app: ntfy }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.33.0
          args: ["serve", "--config", "/etc/ntfy/config/server.yml"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
            - name: config
              mountPath: /etc/ntfy/config
              readOnly: true
            - name: templates
              mountPath: /etc/ntfy/templates
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: config
          secret:
            secretName: ntfy-config
        - name: templates
          configMap:
            name: ntfy-templates

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-config
  namespace: ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: ntfy-config
    template:
      engineVersion: v2
      data:
        server.yml: |
          base-url: https://ntfy.luukblankenstijn.nl
          listen-http: ":8080"
          behind-proxy: true
          cache-file: /var/lib/ntfy/cache.db
          cache-duration: 72h
          auth-file: /var/lib/ntfy/user.db
          auth-default-access: deny-all
          enable-login: true
          enable-signup: false
          auth-users:
            - "luuk:{{ .luuk_password_hash }}:admin"
            - "alertmanager:{{ .alertmanager_password_hash }}:user"
          auth-access:
            - "alertmanager:alerts-*:wo"
          auth-tokens:
            - "alertmanager:{{ .alertmanager_token }}:alertmanager"
          template-dir: /etc/ntfy/templates
          enable-metrics: true
          metrics-listen-http: ":9090"
  dataFrom:
    - extract:
        key: ntfy/ntfy

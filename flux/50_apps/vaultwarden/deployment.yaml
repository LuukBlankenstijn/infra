apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: vaultwarden }
  template:
    metadata:
      labels: { app: vaultwarden }
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.4
          ports:
            - containerPort: 80
          env:
            - name: DOMAIN
              value: https://vaultwarden.luukblankenstijn.nl
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: SMTP_HOST
              value: smtp.protonmail.ch
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURITY
              value: starttls
            - name: SMTP_FROM
              value: vaultwarden@luukblankenstijn.nl
            - name: SMTP_USERNAME
              value: vaultwarden@luukblankenstijn.nl
          envFrom:
            - secretRef:
                name: vaultwarden-db
            - secretRef:
                name: vaultwarden-smtp
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data

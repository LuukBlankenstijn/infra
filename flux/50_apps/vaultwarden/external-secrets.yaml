apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-db
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: postgres
    kind: SecretStore
  target:
    name: vaultwarden-db
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=verify-full&sslrootcert=/etc/ssl/certs/ca-certificates.crt"
  dataFrom:
    - extract:
        key: vaultwarden/vaultwarden
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-smtp
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: vaultwarden-smtp
  data:
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: vaultwarden/vaultwarden
        property: smtp_password

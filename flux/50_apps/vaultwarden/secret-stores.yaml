apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: vaultwarden
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: postgres
  namespace: vaultwarden
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: postgres
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgres-vaultwarden
          serviceAccountRef:
            name: openbao
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secret
  namespace: vaultwarden
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: secret-vaultwarden
          serviceAccountRef:
            name: openbao

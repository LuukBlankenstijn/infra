apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-config
  namespace: netbird
spec:
  refreshInterval: 1h
  target:
    name: netbird-config
    template:
      engineVersion: v2
      data:
        config.yaml: |
          server:
            listenAddress: ":80"
            exposedAddress: "https://netbird.luukblankenstijn.nl:443"
            metricsPort: 9090
            healthcheckAddress: ":9000"
            logLevel: "info"
            logFile: "console"
            authSecret: "{{ .auth_secret }}"
            dataDir: "/var/lib/netbird/"
            stuns:
              - uri: "stun:hertzner.luukblankenstijn.nl:3478"
            disableAnonymousMetrics: true
            disableGeoliteUpdate: false
            auth:
              issuer: "https://netbird.luukblankenstijn.nl/oauth2"
              localAuthDisabled: false
              signKeyRefreshEnabled: false
              sessionCookieEncryptionKey: "{{ .session_cookie_key }}"
              dashboardRedirectURIs:
                - "https://netbird.luukblankenstijn.nl/nb-auth"
                - "https://netbird.luukblankenstijn.nl/nb-silent-auth"
              cliRedirectURIs:
                - "http://localhost:53000/"
              dashboardPostLogoutRedirectURIs:
                - "https://netbird.luukblankenstijn.nl/"
            store:
              engine: "postgres"
              dsn: "postgres://{{ .store_username }}:{{ .store_password }}@{{ .store_host }}:{{ .store_port }}/{{ .store_dbname }}?sslmode=verify-full"
              encryptionKey: "{{ .store_encryption_key }}"
            activityStore:
              engine: "postgres"
              dsn: "postgres://{{ .events_username }}:{{ .events_password }}@{{ .events_host }}:{{ .events_port }}/{{ .events_dbname }}?sslmode=verify-full"
            authStore:
              engine: "postgres"
              dsn: "postgres://{{ .idp_username }}:{{ .idp_password }}@{{ .idp_host }}:{{ .idp_port }}/{{ .idp_dbname }}?sslmode=verify-full"
            reverseProxy:
              trustedHTTPProxies:
                - "10.42.0.0/16"
  data:
  - secretKey: store_encryption_key
    sourceRef:
      storeRef:
        name: secret
        kind: SecretStore
    remoteRef:
      key: netbird/server
      property: store_encryption_key
  - secretKey: session_cookie_key
    sourceRef:
      storeRef:
        name: secret
        kind: SecretStore
    remoteRef:
      key: netbird/server
      property: session_cookie_key
  - secretKey: auth_secret
    sourceRef:
      storeRef:
        name: secret
        kind: SecretStore
    remoteRef:
      key: netbird/server
      property: auth_secret
  - secretKey: store_host
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird
      property: host
  - secretKey: store_port
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird
      property: port
  - secretKey: store_dbname
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird
      property: dbname
  - secretKey: store_username
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird
      property: username
  - secretKey: store_password
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird
      property: password
  - secretKey: events_host
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird_events
      property: host
  - secretKey: events_port
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird_events
      property: port
  - secretKey: events_dbname
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird_events
      property: dbname
  - secretKey: events_username
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird_events
      property: username
  - secretKey: events_password
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird_events
      property: password
  - secretKey: idp_host
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird_idp
      property: host
  - secretKey: idp_port
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird_idp
      property: port
  - secretKey: idp_dbname
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird_idp
      property: dbname
  - secretKey: idp_username
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird_idp
      property: username
  - secretKey: idp_password
    sourceRef:
      storeRef:
        name: postgres
        kind: SecretStore
    remoteRef:
      key: netbird/netbird_idp
      property: password

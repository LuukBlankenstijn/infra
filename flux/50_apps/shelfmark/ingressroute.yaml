apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shelfmark
  namespace: shelfmark
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`shelfmark.luukblankenstijn.nl`) && PathPrefix(`/`)
      middlewares:
        - name: proxy-auth
          namespace: authentik
      kind: Rule
      services:
        - name: shelfmark
          port: 8084

apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: grimmory
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mariadb
  namespace: grimmory
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: mariadb
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: mariadb-grimmory
          serviceAccountRef:
            name: openbao

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grimmory
  namespace: grimmory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: grimmory }
  template:
    metadata:
      labels: { app: grimmory }
    spec:
      containers:
        - name: grimmory
          image: grimmory/grimmory:v3.5.0
          ports:
            - containerPort: 6060
          env:
            - name: BOOKLORE_PORT
              value: "6060"
            - name: USER_ID
              value: "1000"
            - name: GROUP_ID
              value: "1000"
            - name: TZ
              value: Europe/Amsterdam
          envFrom:
            - secretRef:
                name: grimmory-db
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: books
              mountPath: /books
            - name: bookdrop
              mountPath: /bookdrop
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: books
          persistentVolumeClaim:
            claimName: books
        - name: bookdrop
          emptyDir: {}

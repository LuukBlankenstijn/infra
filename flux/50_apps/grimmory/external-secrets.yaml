apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-db
  namespace: grimmory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mariadb
    kind: SecretStore
  target:
    name: grimmory-db
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "jdbc:mariadb://{{ .host }}:{{ .port }}/{{ .dbname }}?sslMode=verify-full"
        DATABASE_USERNAME: "{{ .username }}"
        DATABASE_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: grimmory/grimmory

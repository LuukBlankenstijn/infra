apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mqtt
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: mqtt
  dataFrom:
    - extract:
        key: home-assistant/mqtt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: device-hosts-ca
  namespace: home-assistant
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: pki
    kind: SecretStore
  target:
    name: device-hosts-ca
  dataFrom:
    - extract:
        key: home-assistant/device-hosts-ca

apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16

    automation ui: !include automations.yaml
    scene ui: !include scenes.yaml
    script ui: !include scripts.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: home-assistant }
  template:
    metadata:
      labels: { app: home-assistant }
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config
          image: ghcr.io/home-assistant/home-assistant:2026.10.2
          command:
            - sh
            - -ec
            - |
              cp /seed/configuration.yaml /config/configuration.yaml
              for file in automations.yaml scenes.yaml scripts.yaml; do
                [ -e "/config/$file" ] || echo "[]" > "/config/$file"
              done
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.2
          env:
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: seed
          configMap:
            name: home-assistant
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  selector: { app: home-assistant }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home-assistant.luukblankenstijn.nl`)
      kind: Rule
      services:
        - name: home-assistant
          port: 80
  tls:
    options:
      name: device-mtls
      namespace: traefik

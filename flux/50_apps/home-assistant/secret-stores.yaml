apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: home-assistant
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secret
  namespace: home-assistant
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: secret-home-assistant
          serviceAccountRef:
            name: openbao
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pki
  namespace: home-assistant
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: pki-home-assistant
          serviceAccountRef:
            name: openbao

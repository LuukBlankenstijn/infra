apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: postgres
    kind: SecretStore
  target:
    name: authentik-db
  data:
    - secretKey: AUTHENTIK_POSTGRESQL__HOST
      remoteRef:
        key: authentik/authentik
        property: host
    - secretKey: AUTHENTIK_POSTGRESQL__PORT
      remoteRef:
        key: authentik/authentik
        property: port
    - secretKey: AUTHENTIK_POSTGRESQL__NAME
      remoteRef:
        key: authentik/authentik
        property: dbname
    - secretKey: AUTHENTIK_POSTGRESQL__USER
      remoteRef:
        key: authentik/authentik
        property: username
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: authentik/authentik
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-auth
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: authentik-auth
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik/authentik
        property: secret_key
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: authentik/authentik
        property: bootstrap_token
    - secretKey: AUTHENTIK_EMAIL__PASSWORD
      remoteRef:
        key: authentik/authentik
        property: smtp_password

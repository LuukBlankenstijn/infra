apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  releaseName: authentik-authentik
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: "2026.8.4"
      sourceRef:
        kind: HelmRepository
        name: authentik
  values:
    authentik:
      log_level: info
      disable_update_check: true
      disable_startup_analytics: true
      error_reporting:
        enabled: false
      email:
        from: auth@luukblankenstijn.nl
        host: smtp.protonmail.ch
        port: 587
        use_tls: true
        username: auth@luukblankenstijn.nl
    global:
      env:
        - name: AUTHENTIK_POSTGRESQL__SSLMODE
          value: verify-full
        - name: AUTHENTIK_POSTGRESQL__SSLROOTCERT
          value: system
      envFrom:
        - secretRef:
            name: authentik-db
        - secretRef:
            name: authentik-auth
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - auth.luukblankenstijn.nl
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    worker:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    postgresql:
      enabled: false
  upgrade:
    remediation:
      retries: 3

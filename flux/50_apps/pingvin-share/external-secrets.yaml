apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pingvin-share-config
  namespace: pingvin-share
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik
    kind: SecretStore
  target:
    name: pingvin-share-config
    template:
      engineVersion: v2
      data:
        config.yaml: |
          general:
            appUrl: https://share.luukblankenstijn.nl
            appName: Share
            showHomePage: "false"
          security:
            secureCookies: "true"
            allowRegistration: "false"
            allowUnauthenticatedShares: "false"
          share:
            enableUserRecipients: "true"
            maxSize: "20000000000"
          oauth:
            allowRegistration: "true"
            disablePassword: "true"
            oidc-enabled: "true"
            oidc-discoveryUri: "{{ .issuer }}.well-known/openid-configuration"
            oidc-clientId: "{{ .client_id }}"
            oidc-clientSecret: "{{ .client_secret }}"
            oidc-rolePath: groups
            oidc-roleAdminAccess: infra-admins
  dataFrom:
    - extract:
        key: pingvin-share/pingvin-share

apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: pingvin-share
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: authentik
  namespace: pingvin-share
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: authentik
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: authentik-pingvin-share
          serviceAccountRef:
            name: openbao

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: postgres
    kind: SecretStore
  target:
    name: grafana-db
    template:
      engineVersion: v2
      data:
        GF_DATABASE_HOST: "{{ .host }}:{{ .port }}"
        GF_DATABASE_NAME: "{{ .dbname }}"
        GF_DATABASE_USER: "{{ .username }}"
        GF_DATABASE_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: observability/grafana
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: authentik
    kind: SecretStore
  target:
    name: grafana-oidc
    template:
      engineVersion: v2
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .client_id }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: observability/grafana

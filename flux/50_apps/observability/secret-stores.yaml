apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: observability
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: s3
  namespace: observability
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: s3
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: s3-observability
          serviceAccountRef:
            name: openbao
---

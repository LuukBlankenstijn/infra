apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: traefik
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pki
  namespace: traefik
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: pki-traefik
          serviceAccountRef:
            name: openbao

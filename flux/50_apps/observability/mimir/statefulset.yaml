apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: observability
  labels:
    app.kubernetes.io/name: mimir
spec:
  replicas: 1
  serviceName: mimir-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mimir
          image: grafana/mimir:3.1.2
          args:
            - -target=all
            - -auth.multitenancy-enabled=false
            - -usage-stats.enabled=false
            - -activity-tracker.filepath=/data/activity.log
            - -memberlist.join=mimir-headless.observability.svc.cluster.local:7946
            - -common.storage.backend=s3
            - -common.storage.s3.endpoint=fsn1.your-objectstorage.com
            - -common.storage.s3.region=fsn1
            - -common.storage.s3.bucket-name=luuk-mimir
            - -common.storage.s3.bucket-lookup-type=path
            - -common.storage.s3.access-key-id=$(S3_ACCESS_KEY_ID)
            - -common.storage.s3.secret-access-key=$(S3_SECRET_ACCESS_KEY)
            - -blocks-storage.storage-prefix=blocks
            - -blocks-storage.tsdb.dir=/data/tsdb
            - -blocks-storage.bucket-store.sync-dir=/data/tsdb-sync
            - -ruler-storage.backend=local
            - -ruler-storage.local.directory=/etc/mimir/rules
            - -ruler.rule-path=/data/ruler
            - -compactor.data-dir=/data/compactor
            - -compactor.blocks-retention-period=30d
            - -ingester.ring.replication-factor=1
            - -store-gateway.sharding-ring.replication-factor=1
          env:
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mimir-s3
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mimir-s3
                  key: S3_SECRET_ACCESS_KEY
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
            - name: memberlist
              containerPort: 7946
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: rules
              mountPath: /etc/mimir/rules
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rules
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

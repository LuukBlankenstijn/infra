apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
  labels:
    app.kubernetes.io/name: mimir
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9095
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-headless
  namespace: observability
  labels:
    app.kubernetes.io/name: mimir
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: memberlist
      port: 7946
      targetPort: memberlist

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pki
  namespace: observability
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: pki-observability
          serviceAccountRef:
            name: openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: device-certificates
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pki
    kind: SecretStore
  target:
    name: device-certificates
    template:
      metadata:
        labels:
          x509.luukblankenstijn.nl/watch: "true"
  dataFrom:
    - extract:
        key: observability/device-certificates

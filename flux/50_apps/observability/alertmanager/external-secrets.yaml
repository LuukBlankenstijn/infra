apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: alertmanager-config
    template:
      engineVersion: v2
      data:
        anonymous.yaml: |
          {{- $groups := dict "infra" "computer" "platform" "gear" "data" "floppy_disk" "apps" "package" "security" "lock" "meta" "eyes" }}
          global:
            resolve_timeout: 1h

          time_intervals:
            - name: night
              time_intervals:
                - times:
                    - start_time: "23:00"
                      end_time: "24:00"
                    - start_time: "00:00"
                      end_time: "08:00"
                  location: Europe/Amsterdam

          route:
            receiver: platform
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - matchers: [alertname=~"Watchdog|InfoInhibitor"]
                receiver: blackhole
              - matchers: [alertname=~"Flux.+", severity="info"]
                receiver: blackhole
          {{- range $group, $_ := $groups }}
              - matchers: [group="{{ $group }}"]
                receiver: {{ $group }}
                routes:
                  - matchers: [severity="critical"]
                    repeat_interval: 2h
                  - matchers: [severity=~"warning|error"]
                    repeat_interval: 12h
                    mute_time_intervals: [night]
                  - matchers: [severity="info"]
                    repeat_interval: 168h
          {{- end }}
              - matchers: [severity="critical"]
                repeat_interval: 2h
              - matchers: [severity=~"warning|error"]
                mute_time_intervals: [night]
              - matchers: [severity="info"]
                repeat_interval: 168h

          inhibit_rules:
            - source_matchers: [severity="critical"]
              target_matchers: [severity=~"warning|info"]
              equal: [alertname, namespace, instance]
            - source_matchers: [severity="warning"]
              target_matchers: [severity="info"]
              equal: [alertname, namespace, instance]
            - source_matchers: [alertname="InfoInhibitor"]
              target_matchers: [severity="info"]
              equal: [namespace]

          receivers:
            - name: blackhole
          {{- range $group, $tag := $groups }}
            - name: {{ $group }}
              webhook_configs:
                - url: http://ntfy.ntfy.svc/alerts-{{ $group }}?template=alertmanager&tags={{ $tag }}
                  send_resolved: true
                  http_config:
                    authorization:
                      credentials: {{ $.ntfy_token }}
          {{- end }}
  dataFrom:
    - extract:
        key: observability/alertmanager

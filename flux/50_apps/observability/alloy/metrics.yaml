apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-metrics
  namespace: observability
spec:
  releaseName: alloy-metrics
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.13.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: deployment
      replicas: 1
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"

    rbac:
      rules:
        - apiGroups: ["", "discovery.k8s.io"]
          resources: ["endpoints", "endpointslices", "pods", "services"]
          verbs: ["get", "list", "watch"]

    alloy:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 768Mi
      configMap:
        content: |
          discovery.kubernetes "nodes" {
            role = "node"
          }

          discovery.relabel "nodes" {
            targets = discovery.kubernetes.nodes.targets

            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
            }
          }

          discovery.kubernetes "node_exporter" {
            role = "pod"

            namespaces {
              names = ["node-exporter"]
            }
          }

          discovery.relabel "node_exporter" {
            targets = discovery.kubernetes.node_exporter.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_container_port_number"]
              regex         = "9100"
              action        = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
          }

          discovery.kubernetes "kube_state_metrics" {
            role = "service"

            namespaces {
              names = ["observability"]
            }
          }

          discovery.relabel "kube_state_metrics" {
            targets = discovery.kubernetes.kube_state_metrics.targets

            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              regex         = "kube-state-metrics"
              action        = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_service_port_name"]
              regex         = "http"
              action        = "keep"
            }
          }

          discovery.kubernetes "annotated_pods" {
            role = "pod"
          }

          discovery.relabel "annotated_pods" {
            targets = discovery.kubernetes.annotated_pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
              regex         = "true"
              action        = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_port_number"]
              target_label  = "__meta_kubernetes_pod_annotation_prometheus_io_port"
              action        = "keepequal"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
              regex         = "(.+)"
              target_label  = "__metrics_path__"
            }

            rule {
              source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
              regex         = "([^:]+)(?::\\d+)?;(\\d+)"
              replacement   = "$1:$2"
              target_label  = "__address__"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "job"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              separator     = "/"
              regex         = "(.+)/(.+)"
              replacement   = "$1/$2"
              target_label  = "job"
            }
          }

          prometheus.scrape "kubelet" {
            job_name          = "kubelet"
            targets           = discovery.relabel.nodes.output
            scheme            = "https"
            metrics_path      = "/metrics"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            scrape_interval   = "60s"

            tls_config {
              insecure_skip_verify = true
            }

            forward_to = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.scrape "cadvisor" {
            job_name          = "cadvisor"
            targets           = discovery.relabel.nodes.output
            scheme            = "https"
            metrics_path      = "/metrics/cadvisor"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            scrape_interval   = "60s"

            tls_config {
              insecure_skip_verify = true
            }

            forward_to = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.scrape "node_exporter" {
            job_name        = "node-exporter"
            targets         = discovery.relabel.node_exporter.output
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.scrape "kube_state_metrics" {
            job_name        = "kube-state-metrics"
            targets         = discovery.relabel.kube_state_metrics.output
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.scrape "annotated_pods" {
            targets         = discovery.relabel.annotated_pods.output
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.remote_write "mimir" {
            external_labels = {
              cluster = "home",
            }

            endpoint {
              url = "http://mimir.observability.svc.cluster.local:8080/api/v1/push"
            }
          }

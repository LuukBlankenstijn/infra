apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-metrics
  namespace: observability
spec:
  releaseName: alloy-metrics
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.13.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      type: deployment
      replicas: 1
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"

    alloy:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 768Mi
      configMap:
        content: |
          discovery.kubernetes "nodes" {
            role = "node"
          }

          discovery.relabel "nodes" {
            targets = discovery.kubernetes.nodes.targets

            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
            }
          }

          discovery.relabel "kubelet" {
            targets = discovery.relabel.nodes.output

            rule {
              target_label = "metrics_path"
              replacement  = "/metrics"
            }
          }

          discovery.relabel "cadvisor" {
            targets = discovery.relabel.nodes.output

            rule {
              target_label = "metrics_path"
              replacement  = "/metrics/cadvisor"
            }
          }

          discovery.kubernetes "node_exporter" {
            role = "pod"

            namespaces {
              names = ["node-exporter"]
            }
          }

          discovery.relabel "node_exporter" {
            targets = discovery.kubernetes.node_exporter.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_container_port_number"]
              regex         = "9100"
              action        = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
          }

          discovery.kubernetes "kube_state_metrics" {
            role = "service"

            namespaces {
              names = ["observability"]
            }
          }

          discovery.relabel "kube_state_metrics" {
            targets = discovery.kubernetes.kube_state_metrics.targets

            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              regex         = "kube-state-metrics"
              action        = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_service_port_name"]
              regex         = "http"
              action        = "keep"
            }
          }

          discovery.kubernetes "annotated_pods" {
            role = "pod"
          }

          discovery.relabel "annotated_pods" {
            targets = discovery.kubernetes.annotated_pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
              regex         = "true"
              action        = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_port_number"]
              target_label  = "__meta_kubernetes_pod_annotation_prometheus_io_port"
              action        = "keepequal"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
              regex         = "(.+)"
              target_label  = "__metrics_path__"
            }

            rule {
              source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
              regex         = "([^:]+)(?::\\d+)?;(\\d+)"
              replacement   = "$1:$2"
              target_label  = "__address__"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "job"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              separator     = "/"
              regex         = "(.+)/(.+)"
              replacement   = "$1/$2"
              target_label  = "job"
            }
          }

          prometheus.scrape "kubelet" {
            job_name          = "kubelet"
            targets           = discovery.relabel.kubelet.output
            scheme            = "https"
            metrics_path      = "/metrics"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            scrape_interval   = "60s"

            tls_config {
              insecure_skip_verify = true
            }

            forward_to = [prometheus.relabel.kubelet.receiver]
          }

          prometheus.relabel "kubelet" {
            forward_to = [prometheus.remote_write.mimir.receiver]

            rule {
              source_labels = ["__name__"]
              regex         = "up|kubelet_.+|storage_operation_.+|volume_manager_.+|process_.+"
              action        = "keep"
            }
          }

          prometheus.scrape "cadvisor" {
            job_name          = "kubelet"
            targets           = discovery.relabel.cadvisor.output
            scheme            = "https"
            metrics_path      = "/metrics/cadvisor"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            scrape_interval   = "60s"

            tls_config {
              insecure_skip_verify = true
            }

            forward_to = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.scrape "node_exporter" {
            job_name        = "node-exporter"
            targets         = discovery.relabel.node_exporter.output
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.scrape "kube_state_metrics" {
            job_name        = "kube-state-metrics"
            targets         = discovery.relabel.kube_state_metrics.output
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.scrape "annotated_pods" {
            targets         = discovery.relabel.annotated_pods.output
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          discovery.relabel "host_comin" {
            targets = discovery.relabel.nodes.output

            rule {
              source_labels = ["__address__"]
              regex         = "([^:]+):\\d+"
              replacement   = "$1:4243"
              target_label  = "__address__"
            }
          }

          prometheus.scrape "host_comin" {
            job_name        = "comin"
            targets         = discovery.relabel.host_comin.output
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          discovery.relabel "host_smartctl" {
            targets = discovery.relabel.nodes.output

            rule {
              source_labels = ["__address__"]
              regex         = "([^:]+):\\d+"
              replacement   = "$1:9633"
              target_label  = "__address__"
            }
          }

          prometheus.scrape "host_smartctl" {
            job_name        = "smartctl"
            targets         = discovery.relabel.host_smartctl.output
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          discovery.relabel "host_nvidia_gpu" {
            targets = discovery.relabel.nodes.output

            rule {
              source_labels = ["__address__"]
              regex         = "([^:]+):\\d+"
              replacement   = "$1:9835"
              target_label  = "__address__"
            }
          }

          prometheus.scrape "host_nvidia_gpu" {
            job_name        = "nvidia-gpu"
            targets         = discovery.relabel.host_nvidia_gpu.output
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          discovery.kubernetes "apiserver" {
            role = "endpoints"

            namespaces {
              names = ["default"]
            }
          }

          discovery.relabel "apiserver" {
            targets = discovery.kubernetes.apiserver.targets

            rule {
              source_labels = ["__meta_kubernetes_service_name", "__meta_kubernetes_endpoint_port_name"]
              regex         = "kubernetes;https"
              action        = "keep"
            }
          }

          prometheus.scrape "apiserver" {
            job_name          = "apiserver"
            targets           = discovery.relabel.apiserver.output
            scheme            = "https"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            scrape_interval   = "60s"

            tls_config {
              insecure_skip_verify = true
            }

            forward_to = [prometheus.relabel.apiserver.receiver]
          }

          prometheus.relabel "apiserver" {
            forward_to = [prometheus.remote_write.mimir.receiver]

            rule {
              source_labels = ["__name__"]
              regex         = "up|apiserver_request_total|apiserver_request_terminations_total|apiserver_client_certificate_expiration_seconds_.+|aggregator_unavailable_apiservice.*|apiserver_storage_objects|apiserver_storage_size_bytes|etcd_db_total_size_in_bytes"
              action        = "keep"
            }
          }

          prometheus.operator.servicemonitors "all" {
            forward_to = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.operator.podmonitors "all" {
            forward_to = [prometheus.remote_write.mimir.receiver]
          }

          prometheus.exporter.blackbox "public" {
            config = "{ modules: { https: { prober: http, timeout: 10s, http: { preferred_ip_protocol: ip4, follow_redirects: false, fail_if_not_ssl: true, valid_status_codes: [200, 301, 302, 303, 307, 308, 401, 403] } }, mqtts: { prober: tcp, timeout: 10s, tcp: { preferred_ip_protocol: ip4, tls: true, tls_config: { min_version: TLS13 } } } } }"

            target {
              name    = "authentik"
              address = "https://auth.luukblankenstijn.nl/-/health/live/"
              module  = "https"
            }

            target {
              name    = "vaultwarden"
              address = "https://vaultwarden.luukblankenstijn.nl/alive"
              module  = "https"
            }

            target {
              name    = "grafana"
              address = "https://grafana.luukblankenstijn.nl/api/health"
              module  = "https"
            }

            target {
              name    = "grimmory"
              address = "https://grimmory.luukblankenstijn.nl/"
              module  = "https"
            }

            target {
              name    = "shelfmark"
              address = "https://shelfmark.luukblankenstijn.nl/"
              module  = "https"
            }

            target {
              name    = "netbird"
              address = "https://netbird.luukblankenstijn.nl/"
              module  = "https"
            }

            target {
              name    = "openbao"
              address = "https://openbao.luukblankenstijn.nl/v1/sys/health"
              module  = "https"
            }

            target {
              name    = "longhorn"
              address = "https://longhorn.luukblankenstijn.nl/"
              module  = "https"
            }

            target {
              name    = "mqtt"
              address = "mqtt.luukblankenstijn.nl:443"
              module  = "mqtts"
            }
          }

          discovery.relabel "blackbox" {
            targets = prometheus.exporter.blackbox.public.targets

            rule {
              target_label = "job"
              replacement  = "blackbox"
            }

            rule {
              source_labels = ["__param_target"]
              regex         = "(?:https://)?([^/:]+).*"
              target_label  = "instance"
            }
          }

          prometheus.scrape "blackbox" {
            targets         = discovery.relabel.blackbox.output
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

          mimir.rules.kubernetes "rules" {
            address = "http://mimir.observability.svc.cluster.local:8080"

            rule_selector {
              match_expression {
                key      = "rules.luukblankenstijn.nl/backend"
                operator = "NotIn"
                values   = ["loki"]
              }
            }
          }

          loki.rules.kubernetes "rules" {
            address = "http://loki.observability.svc.cluster.local:3100"

            rule_selector {
              match_labels = {
                "rules.luukblankenstijn.nl/backend" = "loki",
              }
            }
          }

          prometheus.remote_write "mimir" {
            external_labels = {
              cluster = "home",
            }

            endpoint {
              url = "http://mimir.observability.svc.cluster.local:8080/api/v1/push"
            }
          }

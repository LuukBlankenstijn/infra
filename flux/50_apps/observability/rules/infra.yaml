apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infra
  namespace: observability
spec:
  groups:
    - name: hosts
      labels:
        group: infra
      rules:
        - alert: EdgeNotReporting
          expr: absent(up{host="edge", job="node-exporter"} == 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "The edge VPS sends no metrics"
            description: "Either the VPS is down, its Alloy cannot reach metrics.luukblankenstijn.nl, or its client certificate stopped renewing."
        - alert: HomeGatewayNotReporting
          expr: absent(up{host="home-gateway", job="node-exporter"} == 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "home-gateway sends no metrics"
            description: "Either the Pi is down or off Wi-Fi, its Alloy cannot reach metrics.luukblankenstijn.nl, or its client certificate stopped renewing. zigbee2mqtt is unreachable while it is."
        - alert: DiskSmartFailing
          expr: max by (instance, device) (smartctl_device_smart_status) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SMART reports disk {{ $labels.device }} as failing"
        - alert: DiskTemperatureHigh
          expr: max by (instance, device) (smartctl_device_temperature{temperature_type="current"}) > 60
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Disk {{ $labels.device }} is at {{ $value }}°C"
        - alert: GpuTemperatureHigh
          expr: max by (instance, uuid) (nvidia_smi_temperature_gpu) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The GPU is at {{ $value }}°C"
        - alert: KvmDeviceUnavailable
          expr: max(kube_node_status_allocatable{node="home-server", resource="squat_ai_kvm"}) < 1 or absent(kube_node_status_allocatable{node="home-server", resource="squat_ai_kvm"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "home-server offers no squat.ai/kvm device"
            description: "generic-device-plugin in namespace generic-device-plugin is not running or does not find /dev/kvm; the Android emulator cannot be scheduled."
    - name: deployments
      labels:
        group: platform
      rules:
        - alert: CominDeploymentFailed
          expr: max by (host, instance) (comin_last_deployment_failed) == 1 or max by (host, instance) (comin_last_build_failed) == 1 or max by (host, instance) (comin_last_eval_failed) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "comin on {{ $labels.host }}{{ $labels.instance }} cannot deploy the current main"
        - alert: CominFetchFailing
          expr: max by (host, instance) (comin_last_fetch_failed) == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "comin on {{ $labels.host }}{{ $labels.instance }} cannot fetch the repository"
        - alert: HostNeedsReboot
          expr: max by (host, instance) (comin_need_to_reboot) == 1
          for: 6h
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.host }}{{ $labels.instance }} runs a new kernel or initrd only after a reboot"
    - name: tunnel
      labels:
        group: platform
      rules:
        - alert: FrpTunnelDown
          expr: sum(frp_server_proxy_counts_detailed{type="tcp", name=~"http|https"}) < 2 or absent(frp_server_proxy_counts_detailed{type="tcp", name=~"http|https"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "The cluster's http/https proxies are not registered on the edge; nothing public reaches the cluster"

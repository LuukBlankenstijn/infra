apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: data
  namespace: observability
spec:
  groups:
    - name: postgres
      labels:
        group: data
      rules:
        - alert: PostgresDown
          expr: max by (pod) (cnpg_collector_up) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Postgres instance {{ $labels.pod }} is down"
        - alert: PostgresBackupStale
          expr: time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 30 * 3600 or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "The newest Postgres base backup in S3 is {{ $value | humanizeDuration }} old"
            description: "The daily ScheduledBackup runs at 03:00; check the Backup objects in namespace postgres."
        - alert: PostgresBackupFailed
          expr: max(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp) > max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The last Postgres base backup failed"
        - alert: PostgresWalArchivingStalled
          expr: max by (pod) (cnpg_pg_stat_archiver_seconds_since_last_archival) > 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Postgres has not archived a WAL file to S3 for {{ $value | humanizeDuration }}"
            description: "Point-in-time recovery stops at the last archived WAL; check the barman-cloud sidecar logs."
        - alert: PostgresWalArchivingFailing
          expr: max by (pod) (cnpg_pg_stat_archiver_last_failed_time) > max by (pod) (cnpg_pg_stat_archiver_last_archived_time)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "WAL archiving on {{ $labels.pod }} is failing"
    - name: mariadb
      labels:
        group: data
      rules:
        - alert: MariaDBDown
          expr: max(mysql_up) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "MariaDB is down"
        - alert: MariaDBBackupStale
          expr: time() - max(kube_job_status_completion_time{namespace="mariadb", job_name=~"mariadb-daily-.+"}) > 30 * 3600 or absent(kube_job_status_completion_time{namespace="mariadb", job_name=~"mariadb-daily-.+"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "The last successful MariaDB backup finished {{ $value | humanizeDuration }} ago"
            description: "PhysicalBackup mariadb-daily runs at 03:00 and keeps 30 days in S3."
        - alert: MariaDBBackupFailed
          expr: |
            max(kube_job_status_start_time{namespace="mariadb", job_name=~"mariadb-daily-.+"} and on (job_name) kube_job_status_failed{namespace="mariadb"} > 0)
              > max(kube_job_status_completion_time{namespace="mariadb", job_name=~"mariadb-daily-.+"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The latest MariaDB backup job failed"
    - name: longhorn
      labels:
        group: data
      rules:
        - alert: LonghornVolumeFaulted
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness) == 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is faulted"
        - alert: LonghornVolumeDegraded
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness) == 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is degraded"
        - alert: LonghornBackupFailed
          expr: max by (volume, backup) (longhorn_backup_state) == 4
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn backup {{ $labels.backup }} of {{ $labels.volume }} is in error"
        - alert: LonghornBackupStale
          expr: time() - max(kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="daily-backup"}) > 30 * 3600 or absent(kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="daily-backup"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn's daily-backup job last succeeded {{ $value | humanizeDuration }} ago"
        - alert: LonghornBackupTargetUnavailable
          expr: max by (backup_target) (longhorn_backup_target_status{condition="unavailable"}) == 1 or absent(longhorn_backup_target_status{condition="unavailable"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn cannot reach its S3 backup target"
        - alert: LonghornStorageFilling
          expr: max by (node) (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn storage on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
    - name: restore-test
      labels:
        group: data
      rules:
        - alert: RestoreTestFailed
          expr: |
            max(kube_job_status_start_time{namespace="restore-test"} and on (job_name) kube_job_status_failed{namespace="restore-test"} > 0)
              >= max(kube_job_status_start_time{namespace="restore-test"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The latest backup restore test failed"
            description: "kubectl -n restore-test logs job/<latest job> shows which check failed."
        - alert: RestoreTestStale
          expr: time() - max(kube_job_status_completion_time{namespace="restore-test"}) > 8 * 86400 or absent(kube_job_status_completion_time{namespace="restore-test"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No backup restore test succeeded in the last 8 days"

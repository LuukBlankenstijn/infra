apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-rules
  namespace: observability
spec:
  releaseName: kube-prometheus-rules
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.16.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    crds:
      enabled: false
    alertmanager:
      enabled: false
    grafana:
      enabled: false
    prometheus:
      enabled: false
    prometheusOperator:
      enabled: false
    kubeStateMetrics:
      enabled: false
    nodeExporter:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    coreDns:
      enabled: false
    kubeDns:
      enabled: false
    kubeApiServer:
      enabled: false
    kubelet:
      enabled: false
    defaultRules:
      rules:
        alertmanager: false
        etcd: false
        configReloaders: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        prometheus: false
        prometheusOperator: false
        windows: false
      disabled:
        KubeCPUOvercommit: true
        KubeMemoryOvercommit: true
        CPUThrottlingHigh: true
        NodeRAIDDegraded: true
        NodeRAIDDiskFailure: true
      additionalRuleGroupLabels:
        general:
          group: meta
        kubeStateMetrics:
          group: meta
        kubernetesApps:
          group: apps
        kubernetesResources:
          group: infra
        kubernetesStorage:
          group: infra
        kubernetesSystem:
          group: infra
        network:
          group: infra
        node:
          group: infra
        nodeExporterAlerting:
          group: infra

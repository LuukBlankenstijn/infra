apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: apps
  namespace: observability
spec:
  groups:
    - name: public-endpoints
      labels:
        group: apps
      rules:
        - alert: PublicEndpointDown
          expr: probe_success{job="blackbox"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} is unreachable from the internet side"
            description: "The probe goes through public DNS, the edge VPS and the frp tunnel, so this also fires when the tunnel or the edge is down."
    - name: home-assistant
      labels:
        group: apps
      rules:
        - alert: HomeAssistantWorkloadDown
          expr: max by (namespace, deployment) (kube_deployment_status_replicas_available{namespace=~"home-assistant|pi-tunnel"}) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has no available replica"
        - alert: OllamaDown
          expr: max(kube_deployment_status_replicas_available{namespace="ollama"}) < 1 or absent(kube_deployment_status_replicas_available{namespace="ollama"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Ollama has no available replica"
            description: "Home Assistant's printer failure check (ai_task.ollama_ai_task) cannot judge camera frames, so a failed print is not paused."
    - name: tunnelrs
      labels:
        group: apps
      rules:
        - alert: TunnelrsDown
          expr: max by (deployment) (kube_deployment_status_replicas_available{namespace="tunnelrs"}) < 1 or absent(kube_deployment_status_replicas_available{namespace="tunnelrs",deployment="tunnelrs-server"}) or absent(kube_deployment_status_replicas_available{namespace="tunnelrs",deployment="tunnelrs-operator"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "tunnelrs/{{ $labels.deployment }} has no available replica"
            description: "Without the server every tunneled hostname fails; without the operator new or withdrawn routes do not reach Traefik."

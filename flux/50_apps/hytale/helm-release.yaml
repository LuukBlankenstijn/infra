apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hytale
  namespace: hytale
spec:
  releaseName: hytale-hytale
  interval: 30m
  chart:
    spec:
      chart: hytale-server
      sourceRef:
        kind: HelmRepository
        name: hybrowse
      version: 1.1.0
  valuesFrom:
    - kind: ConfigMap
      name: hytale-values
      valuesKey: values.yaml
  install:
    disableWait: true
  upgrade:
    disableWait: true

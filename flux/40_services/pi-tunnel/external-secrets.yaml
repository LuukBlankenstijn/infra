apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frpc
  namespace: pi-tunnel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: frpc
  data:
    - secretKey: FRP_TOKEN
      remoteRef:
        key: pi-tunnel/frp
        property: token
    - secretKey: PI_TUNNEL_SECRET_KEY
      remoteRef:
        key: pi-tunnel/frp
        property: secret_key

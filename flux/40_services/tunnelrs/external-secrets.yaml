apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tunnelrs-server-keys
  namespace: tunnelrs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: tunnelrs-server-keys
  data:
    - secretKey: server.key
      remoteRef:
        key: tunnelrs/keys
        property: server
    - secretKey: ctl.key
      remoteRef:
        key: tunnelrs/keys
        property: ctl
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tunnelrs-operator-key
  namespace: tunnelrs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: tunnelrs-operator-key
  data:
    - secretKey: operator.key
      remoteRef:
        key: tunnelrs/keys
        property: operator

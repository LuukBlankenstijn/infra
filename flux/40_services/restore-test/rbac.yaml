apiVersion: v1
kind: ServiceAccount
metadata:
  name: restore-test
  namespace: restore-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restore-test
  namespace: postgres
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restore-test
  namespace: postgres
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restore-test
subjects:
  - kind: ServiceAccount
    name: restore-test
    namespace: restore-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restore-test
  namespace: mariadb
rules:
  - apiGroups: ["k8s.mariadb.com"]
    resources: ["mariadbs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restore-test
  namespace: mariadb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restore-test
subjects:
  - kind: ServiceAccount
    name: restore-test
    namespace: restore-test

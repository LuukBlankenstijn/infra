apiVersion: v1
kind: ConfigMap
metadata:
  name: frpc
  namespace: frpc
data:
  frpc.toml: |
    serverAddr = "hertzner.luukblankenstijn.nl"
    serverPort = 7000
    loginFailExit = false

    auth.method = "token"
    auth.token = "{{ .Envs.FRP_TOKEN }}"

    transport.tls.enable = true

    [[proxies]]
    name = "https"
    type = "tcp"
    localIP = "traefik-traefik.traefik.svc.cluster.local"
    localPort = 443
    remotePort = 443
    transport.proxyProtocolVersion = "v2"

    [[proxies]]
    name = "http"
    type = "tcp"
    localIP = "traefik-traefik.traefik.svc.cluster.local"
    localPort = 80
    remotePort = 80
    transport.proxyProtocolVersion = "v2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frpc
  namespace: frpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frpc
  template:
    metadata:
      labels:
        app: frpc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frpc
          image: fatedier/frpc:v0.66.0
          args:
            - "-c"
            - /etc/frp/frpc.toml
          envFrom:
            - secretRef:
                name: frpc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/frp
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: frpc

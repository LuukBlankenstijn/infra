serverAddr = "hertzner.luukblankenstijn.nl"
serverPort = 7000
loginFailExit = false

auth.method = "token"
auth.token = "{{ .Envs.FRP_TOKEN }}"

transport.tls.enable = true

[[proxies]]
name = "https"
type = "tcp"
localIP = "traefik-traefik.traefik.svc.cluster.local"
localPort = 443
remotePort = 443
transport.proxyProtocolVersion = "v2"

[[proxies]]
name = "http"
type = "tcp"
localIP = "traefik-traefik.traefik.svc.cluster.local"
localPort = 80
remotePort = 80
transport.proxyProtocolVersion = "v2"

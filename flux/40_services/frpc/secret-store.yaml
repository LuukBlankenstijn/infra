apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: frpc
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secret
  namespace: frpc
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: secret-frpc
          serviceAccountRef:
            name: openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frpc
  namespace: frpc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret
    kind: SecretStore
  target:
    name: frpc
  data:
    - secretKey: FRP_TOKEN
      remoteRef:
        key: frpc/frpc
        property: token

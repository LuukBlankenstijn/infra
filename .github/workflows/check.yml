name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v5

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nix:
              - flake.nix
              - flake.lock
              - nix/**
              - secrets/**
              - .sops.yaml
              - docs/**
              - mkdocs.yml
              - .github/workflows/check.yml

  flake:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: flake evaluates, all hosts evaluate, docs build
        run: nix flake check --print-build-logs

      - name: edge host closure builds
        run: nix build --no-link --print-build-logs .#nixosConfigurations.edge.config.system.build.toplevel

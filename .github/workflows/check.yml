name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v7

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nix:
              - flake.nix
              - flake.lock
              - nix/**
              - secrets/**
              - .sops.yaml
              - docs/**
              - mkdocs.yml
              - .github/workflows/check.yml

  eval:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: flake evaluates, all hosts evaluate, docs build
        run: nix flake check --print-build-logs

  host:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: edge
            runner: ubuntu-latest
          - host: home-server
            runner: ubuntu-latest
          - host: home-assistant
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: ${{ matrix.host }} closure builds
        run: nix build --no-link --print-build-logs .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  flake:
    needs: [changes, eval, host]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job passed or was skipped
        run: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

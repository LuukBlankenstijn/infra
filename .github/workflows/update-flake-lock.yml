name: update flake.lock
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/update-flake-lock@v25
        with:
          pr-title: "flake: weekly lock update"
          pr-labels: |
            dependencies
            automated

site_name: Home infrastructure
site_description: Operational documentation for the home k3s cluster, the edge VPS and the OpenTofu roots
repo_url: https://github.com/LuukBlankenstijn/infra
repo_name: LuukBlankenstijn/infra
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

validation:
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Cluster:
      - Flux layers: cluster/layers.md
      - Cluster access: cluster/access.md
      - Edge and public ingress: cluster/edge.md
      - OpenBao: cluster/openbao.md
      - Secrets: cluster/secrets.md
      - NetBird: cluster/netbird.md
      - NetBird reverse proxy: cluster/reverse-proxy.md
  - Databases:
      - Postgres: databases/postgres.md
      - MariaDB: databases/mariadb.md
      - Backups: databases/backups.md
  - Observability: observability/index.md
  - OpenTofu:
      - Roots: terraform/roots.md
